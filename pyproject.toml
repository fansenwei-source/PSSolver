[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pssolver", "tests", "tools"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
files = ["pssolver/api", "pssolver/core"]
show_error_codes = true

[tool.pssolver.import-contracts]
core = ["torch"]
backends = ["pssolver.api", "pssolver.applications", "pssolver.workflows", "pssolver.runtime"]
operators = ["pssolver.api", "pssolver.applications", "pssolver.workflows", "pssolver.runtime"]
linear_solvers = ["pssolver.api", "pssolver.applications", "pssolver.workflows", "pssolver.runtime"]
